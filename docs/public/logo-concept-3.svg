<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Concept 3: Data Visualization + Rendering Engine
    Rising bars morphing into an upward arrow - representing
    data visualization powered by a high-performance engine.
    Bold, clear silhouette at any size.
  -->
  <g fill="currentColor">
    <!-- Bar 1 - shortest -->
    <rect x="4" y="44" width="10" height="18" rx="2"/>
    <!-- Bar 2 - medium -->
    <rect x="18" y="30" width="10" height="32" rx="2"/>
    <!-- Bar 3 - tall -->
    <rect x="32" y="18" width="10" height="44" rx="2"/>
    <!-- Bar 4 + Arrow - tallest bar transforms into upward arrow -->
    <path d="
      M46,62 L46,16 L46,16
      L38,24 L38,20 L51,4 L64,20 L64,24 L56,16
      L56,62 Z
    " fill-rule="evenodd"/>
    <!-- Subtle rising trend line -->
    <path d="M9,42 L23,28 L37,16 L51,4"
          fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"
          stroke-dasharray="2,5" opacity="0.25"/>
  </g>
</svg>
