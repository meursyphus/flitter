<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Concept 2: Stylized "F" Lettermark
    Bold, forward-leaning F with speed-cut angles.
    The negative space creates a sense of motion.
    Grand proportions, clear at all sizes.
  -->
  <g fill="currentColor">
    <!-- Main F body - single bold path -->
    <path d="
      M10,4 L54,4 L52,16 L24,16
      L24,26 L46,26 L44,38 L24,38
      L24,60 L12,60 Z
    "/>
    <!-- Speed notch cut from top-right corner -->
    <path d="M54,4 L58,4 L56,12 L52,16 Z" opacity="0.5"/>
    <!-- Forward motion accent -->
    <rect x="48" y="29" width="12" height="3.5" rx="1.75" opacity="0.4"/>
    <rect x="50" y="36" width="8" height="3" rx="1.5" opacity="0.25"/>
  </g>
</svg>
