name = "flitter-docs"
main = "docs/src/worker.ts"
compatibility_date = "2026-03-04"

[assets]
directory = "docs/out"
binding = "ASSETS"
# Pages go through the worker so it can apply the theme cookie to the HTML.
# Build output and static files are served straight from assets.
run_worker_first = ["/*", "!/_next/*", "!/charts/*", "!/home/*", "!/og/*", "!/llm/*", "!/schema/*"]
